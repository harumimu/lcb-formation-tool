<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>12囚人編成コード生成（GZIP+BASE64）</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; }
    h1 { font-size: 1.4rem; margin-bottom: 10px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 4px; font-size: 0.8rem; }
    select { font-size: 0.8rem; }
    .code-box { margin-top: 20px; font-size: 1rem; word-break: break-all; }
  </style>

  <!-- GZIPライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
</head>
<body>
  <h1>12囚人編成コード生成ツール（GZIP + BASE64）</h1>

  <table>
    <thead>
      <tr>
        <th>囚人</th>
        <th>人格</th>
        <th>編成順</th>
        <th>ZAYIN</th>
        <th>TETH</th>
        <th>HE</th>
        <th>WAW</th>
        <th>ALEPH</th>
      </tr>
    </thead>
    <tbody id="prisoner-rows"></tbody>
  </table>

  <button onclick="generateAllCode()">全編成コード生成</button>

  <div class="code-box">
    コード: <span id="code">未生成</span>
  </div>

  <script>
    // 囚人の固定順
    const PRISONERS = [
      { id: "01", name: "イサン" },
      { id: "02", name: "ファウスト" },
      { id: "03", name: "ドンキホーテ" },
      { id: "04", name: "良秀" },
      { id: "05", name: "ムルソー" },
      { id: "06", name: "ホンル" },
      { id: "07", name: "ヒースクリフ" },
      { id: "08", name: "イシュメール" },
      { id: "09", name: "ロージャ" },
      { id: "10", name: "シンクレア" },
      { id: "11", name: "ウーティス" },
      { id: "12", name: "グレゴール" }
    ];

    let PERSONA_DATA = {};
    let EGO_DATA = {};

    // JSON読み込み
    Promise.all([
      fetch("personas.json").then(r => r.json()),
      fetch("ego.json").then(r => r.json())
    ]).then(([personas, egos]) => {
      PERSONA_DATA = personas;
      EGO_DATA = egos;
      buildUI();
    });

    function buildUI() {
      const tbody = document.getElementById("prisoner-rows");

      PRISONERS.forEach((p, idx) => {
        const tr = document.createElement("tr");

        // 囚人名
        const tdName = document.createElement("td");
        tdName.textContent = `${idx+1}. ${p.name}`;
        tr.appendChild(tdName);

        // 人格
        const tdPersona = document.createElement("td");
        const selPersona = document.createElement("select");
        selPersona.id = `persona-${p.id}`;
        PERSONA_DATA[p.id].personas.forEach((name, i) => {
          const opt = document.createElement("option");
          opt.value = i;
          opt.textContent = `${i} : ${name}`;
          selPersona.appendChild(opt);
        });
        tdPersona.appendChild(selPersona);
        tr.appendChild(tdPersona);

        // 編成順
        const tdOrder = document.createElement("td");
        const selOrder = document.createElement("select");
        selOrder.id = `order-${p.id}`;
        const opt0 = document.createElement("option");
        opt0.value = 0;
        opt0.textContent = "0: 未選択";
        selOrder.appendChild(opt0);
        for (let i = 1; i <= 12; i++) {
          const opt = document.createElement("option");
          opt.value = i;
          opt.textContent = i;
          selOrder.appendChild(opt);
        }
        tdOrder.appendChild(selOrder);
        tr.appendChild(tdOrder);

        // EGOプルダウン生成
        function makeEgoSelect(type) {
          const sel = document.createElement("select");
          sel.id = `${type}-${p.id}`;
          EGO_DATA[p.id][type].forEach((name, i) => {
            const opt = document.createElement("option");
            opt.value = i;
            opt.textContent = `${i} : ${name}`;
            sel.appendChild(opt);
          });
          return sel;
        }

        const tdZ = document.createElement("td");
        tdZ.appendChild(makeEgoSelect("ZAYIN"));
        tr.appendChild(tdZ);

        const tdT = document.createElement("td");
        tdT.appendChild(makeEgoSelect("TETH"));
        tr.appendChild(tdT);

        const tdH = document.createElement("td");
        tdH.appendChild(makeEgoSelect("HE"));
        tr.appendChild(tdH);

        const tdW = document.createElement("td");
        tdW.appendChild(makeEgoSelect("WAW"));
        tr.appendChild(tdW);

        const tdA = document.createElement("td");
        tdA.appendChild(makeEgoSelect("ALEPH"));
        tr.appendChild(tdA);

        tbody.appendChild(tr);
      });
    }

    // ビット詰め
    function pushBits(bits, value, length) {
      for (let i = length - 1; i >= 0; i--) {
        bits.push((value >> i) & 1);
      }
    }

    function bitsToBytes(bits) {
      const bytes = [];
      for (let i = 0; i < bits.length; i += 8) {
        let b = 0;
        for (let j = 0; j < 8; j++) {
          b = (b << 1) | (bits[i + j] || 0);
        }
        bytes.push(b);
      }
      return new Uint8Array(bytes);
    }

    function uint8ToBase64(u8) {
      let binary = "";
      for (let i = 0; i < u8.length; i++) {
        binary += String.fromCharCode(u8[i]);
      }
      return btoa(binary);
    }

    // 全囚人コード生成
    function generateAllCode() {
      const bits = [];

      // 先頭1bit（仕様）
      bits.push(0);

      PRISONERS.forEach(p => {
        const pid = p.id;

        const personaIndex = parseInt(document.getElementById(`persona-${pid}`).value, 10) || 0;
        const order = parseInt(document.getElementById(`order-${pid}`).value, 10) || 0;
        const z = parseInt(document.getElementById(`ZAYIN-${pid}`).value, 10) || 0;
        const t = parseInt(document.getElementById(`TETH-${pid}`).value, 10) || 0;
        const h = parseInt(document.getElementById(`HE-${pid}`).value, 10) || 0;
        const w = parseInt(document.getElementById(`WAW-${pid}`).value, 10) || 0;
        const a = parseInt(document.getElementById(`ALEPH-${pid}`).value, 10) || 0;

        pushBits(bits, personaIndex, 7);
        pushBits(bits, order, 4);
        pushBits(bits, z, 7);
        pushBits(bits, t, 7);
        pushBits(bits, h, 7);
        pushBits(bits, w, 7);
        pushBits(bits, a, 7);
      });

      // 末尾11bit
      for (let i = 0; i < 11; i++) bits.push(0);

      const rawBytes = bitsToBytes(bits);
      const gzipped = pako.gzip(rawBytes);
      const base64 = uint8ToBase64(gzipped);

      document.getElementById("code").textContent = base64;
    }
  </script>
</body>
</html>

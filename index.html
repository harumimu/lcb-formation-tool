      { id: "08", name: "イシュメール", personas: ["なし", "LCB囚人", "R社第4群トナカイチーム", "南部シ協会5課", "LCCB係長", "ロボトミーE.G.O::たゆたう", "南部リウ協会4課", "豊歯ポートセンター フィクサー", "ピークォド号船長", "エドガー家 バトラー", "西部ツヴァイ協会3課", "黒雲会組長", "家主候補", "定事務所代表", "蜘蛛の巣 中指の子方", "LCD現場推理チーム", "オートクチュール::ル・ルージュ ブティーク"], egos: { ZAYIN: ["銛穿ち", "蝍蛆殺"], TETH: ["なし", "桃色の欲望", "カポーデ", "過ぎし日"], HE: ["なし", "紅炎殺", "羽ばたき", "クリスマスの悪夢", "海嘯の悲歌"], WAW: ["なし", "盲目"], ALEPH: ["なし"] } },
      { id: "09", name: "ロージャ", personas: ["なし", "LCB囚人", "黒雲会若衆", "LCCB係長", "N社中鎚", "バラのスパナ工房代表", "南部ツヴァイ協会5課", "南部ディエーチ協会4課", "南部リウ協会4課部長", "T社2級徴収職職員", "北部ヂェーヴィチ協会3課", "ラ・マンチャランドの姫", "黒獣-巳", "ロボトミーE.G.O::涙で研ぎ澄まされた剣", "R社第4群トナカイチーム", "薬指野獣派ドーセント", "蜘蛛の巣 親指の親方", "オートクチュール::お直し室"], egos: { ZAYIN: ["投げられたもの", "夕焼けの中へ"], TETH: ["なし", "氷の脚", "湧き立つ腐食", "鏡触覚"], HE: ["なし", "4本目のマッチの火", "執行", "呪いの釘"], WAW: ["なし", "血色の欲望", "指定裁判"], ALEPH: ["なし"] } },
      { id: "10", name: "シンクレア", personas: ["なし", "LCB囚人", "剣契殺手", "南部ツヴァイ協会6課", "マリアッチボス", "握らんとする者", "ロボトミーE.G.O::紅籍", "奥歯ボートセンター フィクサー", "南部センク協会4課部長", "夜明事務所フィクサー", "西部ツヴァイ協会3課", "北部ヂェーヴィチ協会3課", "中指末弟", "東部親指ソルダートII", "黒獣-酉", "蜘蛛の巣 小指の子方"], egos: { ZAYIN: ["知識の木の枝", "低いなきごえ"], TETH: ["なし", "迫り来る日", "一生シチュー", "呪いの釘"], HE: ["なし", "提灯", "9章2節", "ハーモニー"], WAW: ["なし", "汚血泣涙"], ALEPH: ["なし"] } },

      { id: "12", name: "グレゴール", personas: ["なし", "LCB囚人", "南部リウ協会6課", "G社課長代理", "りょ・ミ・パ助手", "バラのスパナ工房フィクサー", "南部ツヴァイ協会4課", "双鈎海賊団副船長", "黒雲会副組長", "エドガー家 継承者", "ラ・マンチャランド 神父", "炎拳事務所生存者", "黒獣-巳", "夜の錐カピターノ", "ロボトミーE.G.O::ランプ", "LCE E.G.O::AEDD", "夜明事務所代表"], egos: { ZAYIN: ["ある日突然", "まやかし"], TETH: ["なし", "提灯", "過ぎし日", "転入届"], HE: ["なし", "AEDD", "厳粛な哀悼", "クリスマスの悪夢"], WAW: ["なし", "茨の花園", "輝かざる栄光"], ALEPH: ["なし"] } }
    ];

    // 初期状態: 人格 1 (LCB囚人), ZAYIN 0 (初期E.G.O), その他 0
    let currentState = Array.from({ length: 12 }, () => ({
      persona: 1, order: 0, ZAYIN: 0, TETH: 0, HE: 0, WAW: 0, ALEPH: 0
    }));

    // --- BitStream クラス ---
    class BitStream {
      constructor(buffer) {
        this.bytes = new Uint8Array(buffer);
        this.bitPos = 0;
      }
      static create(bitLength) {
        const byteLen = Math.ceil(bitLength / 8);
        return new BitStream(new ArrayBuffer(byteLen));
      }
      writeBits(val, numBits) {
        for (let i = numBits - 1; i >= 0; i--) {
          const bit = (val >> i) & 1;
          const byteIdx = Math.floor(this.bitPos / 8);
          const bitIdx = 7 - (this.bitPos % 8);
          if (bit) this.bytes[byteIdx] |= (1 << bitIdx);
          this.bitPos++;
        }
      }
      readBits(numBits) {
        let val = 0;
        for (let i = 0; i < numBits; i++) {
          const byteIdx = Math.floor(this.bitPos / 8);
          const bitIdx = 7 - (this.bitPos % 8);
          const bit = (this.bytes[byteIdx] >> bitIdx) & 1;
          val = (val << 1) | bit;
          this.bitPos++;
        }
        return val;
      }
    }

    // --- UI生成 ---
    function renderUI() {
      const container = document.getElementById('deckContainer');
      container.innerHTML = '';

      SINNERS.forEach((sinner, idx) => {
        const state = currentState[idx];
        const card = document.createElement('div');
        card.className = 'sinner-card';

        let orderOptions = `<option value="0" ${state.order === 0 ? 'selected' : ''}>未選択 (0)</option>`;
        for (let i = 1; i <= 12; i++) {
          orderOptions += `<option value="${i}" ${state.order === i ? 'selected' : ''}>${i}番目</option>`;
        }

        let html = `
          <div class="sinner-header">
            <span>${sinner.id}. ${sinner.name}</span>
            <span style="font-size:0.8em; font-weight:normal;">編成順: 
              <select class="sel-order" onchange="updateVal(${idx}, 'order', this.value)" style="padding:2px;">${orderOptions}</select>
            </span>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label>人格:</label>
              <select class="sel-persona" onchange="updateVal(${idx}, 'persona', this.value)">
                ${sinner.personas.map((p, pIdx) => `<option value="${pIdx}" ${pIdx === state.persona ? 'selected' : ''}>${p}</option>`).join('')}
              </select>
            </div>
        `;

        ["ZAYIN", "TETH", "HE", "WAW", "ALEPH"].forEach(rank => {
          const list = sinner.egos[rank] || ["なし"];
          html += `
            <div class="form-group">
              <label>E.G.O (${rank}):</label>
              <select class="sel-${rank}" onchange="updateVal(${idx}, '${rank}', this.value)">
                ${list.map((e, eIdx) => `<option value="${eIdx}" ${eIdx === state[rank] ? 'selected' : ''}>${e}</option>`).join('')}
              </select>
            </div>
          `;
        });

        html += `</div>`;
        card.innerHTML = html;
        container.appendChild(card);
      });
    }

    function updateVal(sinnerIdx, key, val) {
      currentState[sinnerIdx][key] = parseInt(val, 10);
    }

    function syncStateFromUI() {
      const cards = document.querySelectorAll('.sinner-card');
      if (cards.length === 0) return;
      
      cards.forEach((card, idx) => {
        currentState[idx].order = card.querySelector('.sel-order').selectedIndex;
        currentState[idx].persona = card.querySelector('.sel-persona').selectedIndex;
        currentState[idx].ZAYIN = card.querySelector('.sel-ZAYIN').selectedIndex;
        currentState[idx].TETH = card.querySelector('.sel-TETH').selectedIndex;
        currentState[idx].HE = card.querySelector('.sel-HE').selectedIndex;
        currentState[idx].WAW = card.querySelector('.sel-WAW').selectedIndex;
        currentState[idx].ALEPH = card.querySelector('.sel-ALEPH').selectedIndex;
      });
    }

    // --- デコード処理 ---
    async function importData() {
      const code = document.getElementById('importCode').value.trim();
      if (!code) return;

      try {
        const binaryStr = atob(code);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        const decompressedBuffer = await new Response(stream).arrayBuffer();

        const bs = new BitStream(decompressedBuffer);

        bs.readBits(1);

        for (let i = 0; i < 12; i++) {
          currentState[i].persona = bs.readBits(7);
          currentState[i].order   = bs.readBits(4);
          currentState[i].ZAYIN   = bs.readBits(7);
          currentState[i].TETH    = bs.readBits(7);
          currentState[i].HE      = bs.readBits(7);
          currentState[i].WAW     = bs.readBits(7);
          currentState[i].ALEPH   = bs.readBits(7);
        }

        renderUI();
        alert("コードを取り込みました。");
      } catch (err) {
        console.error(err);
        alert("コードの解析に失敗しました。");
      }
    }

    // --- エンコード処理 ---
    async function exportData() {
      try {
        syncStateFromUI();

        const bs = BitStream.create(564);

        bs.writeBits(0, 1);

        for (let i = 0; i < 12; i++) {
          const s = currentState[i];
          bs.writeBits(s.persona, 7);
          bs.writeBits(s.order, 4);
          bs.writeBits(s.ZAYIN, 7);
          bs.writeBits(s.TETH, 7);
          bs.writeBits(s.HE, 7);
          bs.writeBits(s.WAW, 7);
          bs.writeBits(s.ALEPH, 7);
        }

        bs.writeBits(0, 11);

        const stream = new Blob([bs.bytes]).stream().pipeThrough(new CompressionStream('gzip'));
        const compressedBuffer = await new Response(stream).arrayBuffer();

        const compressedBytes = new Uint8Array(compressedBuffer);
        let binaryStr = '';
        for (let i = 0; i < compressedBytes.byteLength; i++) {
          binaryStr += String.fromCharCode(compressedBytes[i]);
        }
        const base64Code = btoa(binaryStr);

        document.getElementById('exportCode').value = base64Code;
      } catch (err) {
        console.error(err);
        alert("コードの生成に失敗しました。");
      }
    }

    renderUI();
    exportData();
  </script>

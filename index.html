<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>コード生成ツール</title>
  <!-- GZIPライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
</head>
<body>
  <h1>コード生成ツール（GZIP + BASE64）</h1>

  <button onclick="generateCode()">コード生成</button>

  <div style="margin-top: 20px;">
    コード: <span id="code">未生成</span>
  </div>

  <script>
    function generateCode() {
      // 1. 対象のオブジェクトデータを準備
      const data = {
        persona: 0,
        order: 0,
        zayin: 0
      };

      // 2. オブジェクトを JSON 文字列に変換
      const jsonString = JSON.stringify(data);

      // 3. JSON 文字列を GZIP 圧縮
      const gzipped = pako.gzip(jsonString);

      // 4. バイト配列を Base64 文字列に変換
      let binary = "";
      for (let i = 0; i < gzipped.length; i++) {
        binary += String.fromCharCode(gzipped[i]);
      }
      const base64 = btoa(binary);

      // 5. 画面に出力
      document.getElementById("code").textContent = base64;
    }
  </script>
</body>
</html>

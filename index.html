    // --- UI レンダリング ---
    function renderForm() {
      const container = document.getElementById('deckContainer');
      container.innerHTML = '';

      for (let id in PERSONA_MASTER) {
        const sinner = PERSONA_MASTER[id];
        const egoList = EGO_MASTER[id];
        const state = currentDeckState[id];

        const card = document.createElement('div');
        card.className = 'sinner-card';

        let html = `<div class="sinner-header">${id}. ${sinner.name}</div>`;

        // 人格選択
        html += `
          <div class="form-group">
            <label>人格:</label>
            <select onchange="updatePersona('${id}', this.value)">
              ${sinner.personas.map(p => `<option value="${p}" ${p === state.persona ? 'selected' : ''}>${p}</option>`).join('')}
            </select>
          </div>
        `;

        // E.G.O選択 (ZAYIN〜ALEPH)
        const ranks = ["ZAYIN", "TETH", "HE", "WAW", "ALEPH"];
        ranks.forEach(rank => {
          if (egoList[rank]) {
            html += `
              <div class="form-group">
                <label>E.G.O (${rank}):</label>
                <select onchange="updateEgo('${id}', '${rank}', this.value)">
                  ${egoList[rank].map(e => `<option value="${e}" ${e === state.ego[rank] ? 'selected' : ''}>${e}</option>`).join('')}
                </select>
              </div>
            `;
          }
        });

        card.innerHTML = html;
        container.appendChild(card);
      }
    }

    function updatePersona(id, val) { currentDeckState[id].persona = val; }
    function updateEgo(id, rank, val) { currentDeckState[id].ego[rank] = val; }

    // --- 圧縮 / 解凍 処理 ---
    async function encode(dataObj) {
      const jsonStr = JSON.stringify(dataObj);
      const rawBytes = new TextEncoder().encode(jsonStr);
      const stream = new Blob([rawBytes]).stream().pipeThrough(new CompressionStream('gzip'));
      const compressedBuffer = await new Response(stream).arrayBuffer();
      
      const bytes = new Uint8Array(compressedBuffer);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    async function decode(base64Str) {
      const binary = atob(base64Str.trim());
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const jsonStr = await new Response(stream).text();
      return JSON.parse(jsonStr);
    }

    // --- インポート / エクスポート ---
    async function importData() {
      const code = document.getElementById('importCode').value;
      if (!code) return;
      try {
        const decoded = await decode(code);
        if (typeof decoded === 'object') {
          // 読み込んだデータで現在の状態を更新
          for (let id in decoded) {
            if (currentDeckState[id]) {
              currentDeckState[id] = decoded[id];
            }
          }
          renderForm();
          alert('コードの読み込みに成功しました');
        }
      } catch (e) {
        alert('コードの解凍に失敗しました。形式を確認してください。');
      }
    }

    async function exportData() {
      try {
        const code = await encode(currentDeckState);
        document.getElementById('exportCode').value = code;
      } catch (e) {
        alert('コード生成に失敗しました');
      }
    }

    renderForm();

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>12囚人完全編成コード生成</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 4px; font-size: 0.8rem; }
    select { font-size: 0.8rem; }
    .code-box { margin-top: 20px; font-size: 0.9rem; word-break: break-all; background: #f4f4f4; padding: 10px; border-radius: 4px; }
  </style>

  <!-- GZIPライブラリ (pako) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
</head>
<body>
  <h1>12囚人編成コード生成（69バイト完全保障版）</h1>

  <table>
    <thead>
      <tr>
        <th>囚人</th>
        <th>人格</th>
        <th>編成順</th>
        <th>ZAYIN</th>
        <th>TETH</th>
        <th>HE</th>
        <th>WAW</th>
        <th>ALEPH</th>
      </tr>
    </thead>
    <tbody id="prisoner-rows"></tbody>
  </table>

  <button onclick="generateAllCode()" style="margin-top: 15px; padding: 8px 16px;">全編成コード生成</button>

  <div class="code-box">
    <strong>生成コード (Base64):</strong><br />
    <span id="code">未生成</span>
  </div>

  <script>
    const PRISONERS = [
      { id: "01", name: "イサン" },
      { id: "02", name: "ファウスト" },
      { id: "03", name: "ドンキホーテ" },
      { id: "04", name: "良秀" },
      { id: "05", name: "ムルソー" },
      { id: "06", name: "ホンル" },
      { id: "07", name: "ヒースクリフ" },
      { id: "08", name: "イシュメール" },
      { id: "09", name: "ロージャ" },
      { id: "10", name: "シンクレア" },
      { id: "11", name: "ウーティス" },
      { id: "12", name: "グレゴール" }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      buildUI();
    });

    function buildUI() {
      const tbody = document.getElementById("prisoner-rows");
      tbody.innerHTML = "";

      PRISONERS.forEach((p, idx) => {
        const tr = document.createElement("tr");

        // 囚人名
        const tdName = document.createElement("td");
        tdName.textContent = `${idx+1}. ${p.name}`;
        tr.appendChild(tdName);

        // 人格
        const tdPersona = document.createElement("td");
        const selPersona = document.createElement("select");
        selPersona.id = `persona-${p.id}`;
        for (let i = 1; i <= 20; i++) {
          const opt = document.createElement("option");
          opt.value = i;
          opt.textContent = `${i} : 人格${i}`;
          selPersona.appendChild(opt);
        }
        tdPersona.appendChild(selPersona);
        tr.appendChild(tdPersona);

        // 編成順
        const tdOrder = document.createElement("td");
        const selOrder = document.createElement("select");
        selOrder.id = `order-${p.id}`;
        const opt0 = document.createElement("option");
        opt0.value = 0;
        opt0.textContent = "0: 未選択";
        selOrder.appendChild(opt0);
        for (let i = 1; i <= 12; i++) {
          const opt = document.createElement("option");
          opt.value = i;
          opt.textContent = i;
          selOrder.appendChild(opt);
        }
        tdOrder.appendChild(selOrder);
        tr.appendChild(tdOrder);

        // EGOプルダウン生成
        ["ZAYIN", "TETH", "HE", "WAW", "ALEPH"].forEach(type => {
          const td = document.createElement("td");
          const sel = document.createElement("select");
          sel.id = `${type}-${p.id}`;
          const startVal = (type === "ZAYIN") ? 1 : 0;
          for (let i = startVal; i <= 5; i++) {
            const opt = document.createElement("option");
            opt.value = i;
            opt.textContent = `${i} : EGO${i}`;
            sel.appendChild(opt);
          }
          td.appendChild(sel);
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });
    }

    // ビット配列（552bit）を確実に69バイトのUint8Arrayに変換する関数
    function bitsTo69Bytes(bits) {
      const bytes = new Uint8Array(69); // 確実に69バイト長を確保
      for (let i = 0; i < 69; i++) {
        let byteVal = 0;
        for (let j = 0; j < 8; j++) {
          const bitIndex = i * 8 + j;
          const bit = bits[bitIndex] || 0;
          byteVal = (byteVal << 1) | bit;
        }
        bytes[i] = byteVal;
      }
      return bytes;
    }

    function generateAllCode() {
      const bits = [];

      // 1. 先頭1bit（0）
      bits.push(0);

      // 2. 12人分のデータ（1人45bit × 12 = 540bit）
      PRISONERS.forEach(p => {
        const pid = p.id;

        const personaIndexVal = parseInt(document.getElementById(`persona-${pid}`).value, 10) || 1;
        const personaIndex = personaIndexVal - 1; // 0始まり
        const order = parseInt(document.getElementById(`order-${pid}`).value, 10) || 0;
        const z = parseInt(document.getElementById(`ZAYIN-${pid}`).value, 10) || 1;
        const t = parseInt(document.getElementById(`TETH-${pid}`).value, 10) || 0;
        const h = parseInt(document.getElementById(`HE-${pid}`).value, 10) || 0;
        const w = parseInt(document.getElementById(`WAW-${pid}`).value, 10) || 0;
        const a = parseInt(document.getElementById(`ALEPH-${pid}`).value, 10) || 0;

        // 数値を指定ビット数の2進数ビット配列に変換して押し出す
        const pushBits = (val, len) => {
          for (let i = len - 1; i >= 0; i--) {
            bits.push((val >> i) & 1);
          }
        };

        pushBits(personaIndex, 7);
        pushBits(order, 4);
        pushBits(z, 7);
        pushBits(t, 7);
        pushBits(h, 7);
        pushBits(w, 7);
        pushBits(a, 7);
      });

      // 3. 末尾11bit（0）
      for (let i = 0; i < 11; i++) {
        bits.push(0);
      }

      // 4. ビット列（計552bit）を固定69バイトのUint8Arrayにする
      const rawBytes = bitsTo69Bytes(bits);

      // 5. pako.gzip で圧縮（level: 0 を指定して無圧縮データとして保持させ、データの過度な省略を防ぐ）
      const gzipped = pako.gzip(rawBytes, { level: 0 });

      // 6. Base64化
      let binary = "";
      for (let i = 0; i < gzipped.length; i++) {
        binary += String.fromCharCode(gzipped[i]);
      }
      const base64 = btoa(binary);

      document.getElementById("code").textContent = base64;
    }
  </script>
</body>
</html>

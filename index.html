    document.addEventListener("DOMContentLoaded", () => {

    function buildUI() {
      const tbody = document.getElementById("prisoner-rows");
      tbody.innerHTML = "";

      PRISONERS.forEach((p, idx) => {
        const tr = document.createElement("tr");

        const tdName = document.createElement("td");
        tdName.textContent = `${idx+1}. ${p.name}`;
        tr.appendChild(tdName);

        const tdPersona = document.createElement("td");
        const selPersona = document.createElement("select");
        selPersona.id = `persona-${p.id}`;
        (PERSONA_DATA[p.id]?.personas || []).forEach((name, i) => {
          const opt = document.createElement("option");
          opt.value = i + 1;
          opt.textContent = `${i + 1} : ${name}`;
          selPersona.appendChild(opt);
        });
        tdPersona.appendChild(selPersona);
        tr.appendChild(tdPersona);

        const tdOrder = document.createElement("td");
        const selOrder = document.createElement("select");
        selOrder.id = `order-${p.id}`;
        const opt0 = document.createElement("option");
        opt0.value = 0;
        opt0.textContent = "0: 未選択";
        selOrder.appendChild(opt0);
        for (let i = 1; i <= 12; i++) {
          const opt = document.createElement("option");
          opt.value = i;
          opt.textContent = i;
          selOrder.appendChild(opt);
        }
        tdOrder.appendChild(selOrder);
        tr.appendChild(tdOrder);

        function makeEgoSelect(type) {
          const sel = document.createElement("select");
          sel.id = `${type}-${p.id}`;
          const egoList = EGO_DATA[p.id]?.[type] || [];
          egoList.forEach((name, i) => {
            if (type === "ZAYIN" && i === 0) return;
            const opt = document.createElement("option");
            opt.value = i; 
            opt.textContent = `${i} : ${name}`;
            sel.appendChild(opt);
          });
          return sel;
        }

        ["ZAYIN", "TETH", "HE", "WAW", "ALEPH"].forEach(type => {
          const td = document.createElement("td");
          td.appendChild(makeEgoSelect(type));
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });
    }

    function pushBits(bits, value, length) {
      for (let i = length - 1; i >= 0; i--) {
        bits.push((value >> i) & 1);
      }
    }

    function readBits(bits, offset, length) {
      let val = 0;
      for (let i = 0; i < length; i++) {
        val = (val << 1) | bits[offset + i];
      }
      return val;
    }

    function bitsToBytes(bits) {
      const bytes = [];
      for (let i = 0; i < bits.length; i += 8) {
        let b = 0;
        for (let j = 0; j < 8; j++) {
          b = (b << 1) | (bits[i + j] || 0);
        }
        bytes.push(b);
      }
      return new Uint8Array(bytes);
    }

    function bytesToBits(u8) {
      const bits = [];
      for (let i = 0; i < u8.length; i++) {
        for (let j = 7; j >= 0; j--) {
          bits.push((u8[i] >> j) & 1);
        }
      }
      return bits;
    }

    function generateAllCode() {
      document.getElementById("error-msg").textContent = "";
      const bits = [];

      bits.push(0); // 先頭1bit

      PRISONERS.forEach(p => {
        const pid = p.id;
        const personaIndexVal = parseInt(document.getElementById(`persona-${pid}`).value, 10) || 1;
        const personaIndex = personaIndexVal - 1;
        const order = parseInt(document.getElementById(`order-${pid}`).value, 10) || 0;
        const z = parseInt(document.getElementById(`ZAYIN-${pid}`).value, 10) || 1;
        const t = parseInt(document.getElementById(`TETH-${pid}`).value, 10) || 0;
        const h = parseInt(document.getElementById(`HE-${pid}`).value, 10) || 0;
        const w = parseInt(document.getElementById(`WAW-${pid}`).value, 10) || 0;
        const a = parseInt(document.getElementById(`ALEPH-${pid}`).value, 10) || 0;

        pushBits(bits, personaIndex, 7);
        pushBits(bits, order, 4);
        pushBits(bits, z, 7);
        pushBits(bits, t, 7);
        pushBits(bits, h, 7);
        pushBits(bits, w, 7);
        pushBits(bits, a, 7);
      });

      for (let i = 0; i < 11; i++) bits.push(0); // 末尾11bit (計552bit / 69バイト)

      const rawBytes = bitsToBytes(bits);
      const gzipped = pako.gzip(rawBytes);
      
      let binary = "";
      for (let i = 0; i < gzipped.length; i++) {
        binary += String.fromCharCode(gzipped[i]);
      }
      const base64 = btoa(binary);

      document.getElementById("code").textContent = base64;
    }

    function loadCode() {
      const err = document.getElementById("error-msg");
      err.textContent = "";
      const inputStr = document.getElementById("input-code").value.trim();
      
      if (!inputStr) {
        err.textContent = "コードを入力してください。";
        return;
      }

      try {
        const binaryStr = atob(inputStr);
        const u8Array = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
          u8Array[i] = binaryStr.charCodeAt(i);
        }

        const decompressed = pako.ungzip(u8Array);
        if (decompressed.length < 69) {
          err.textContent = `データ長が不足しています（必要: 69バイト / 実際: ${decompressed.length}バイト）。`;
          return;
        }

        const bits = bytesToBits(decompressed);
        let offset = 1; // 先頭1bitをスキップ

        PRISONERS.forEach(p => {
          const pid = p.id;
          const personaIndex = readBits(bits, offset, 7); offset += 7;
          const order = readBits(bits, offset, 4);        offset += 4;
          const z = readBits(bits, offset, 7);            offset += 7;
          const t = readBits(bits, offset, 7);            offset += 7;
          const h = readBits(bits, offset, 7);            offset += 7;
          const w = readBits(bits, offset, 7);            offset += 7;
          const a = readBits(bits, offset, 7);            offset += 7;

          document.getElementById(`persona-${pid}`).value = personaIndex + 1;
          document.getElementById(`order-${pid}`).value = order;
          document.getElementById(`ZAYIN-${pid}`).value = z;
          document.getElementById(`TETH-${pid}`).value = t;
          document.getElementById(`HE-${pid}`).value = h;
          document.getElementById(`WAW-${pid}`).value = w;
          document.getElementById(`ALEPH-${pid}`).value = a;
        });

        generateAllCode();
      } catch (e) {
        err.textContent = "コードの解読に失敗しました。正しいフォーマットか確認してください。";
      }
    }

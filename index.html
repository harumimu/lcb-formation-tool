<head>
  <meta charset="UTF-8">

  <title>Limbus Company 囚人データ管理 / 수감자 데이터 관리</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #ff3333;
      --text-color: #e0e0e0;
      --border-color: #333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto 20px auto;
    }

    h1 {
      margin: 0;
      color: var(--accent-color);
      letter-spacing: 2px;
      font-size: 1.8rem;
    }

    .lang-switcher {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .lang-btn {
      padding: 6px 12px;
      background-color: #2a2a2a;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .lang-btn.active {
      background-color: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .code-panel {
      max-width: 1200px;
      margin: 0 auto 30px auto;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .code-panel h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: var(--accent-color);
    }

    .code-controls {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .code-input {
      flex: 1;
      min-width: 250px;
      font-family: monospace;
      padding: 8px 12px;
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    .btn {
      padding: 8px 16px;
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #cc0000;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    .sinner-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .sinner-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .sinner-title {
      display: flex;
      align-items: center;
    }

    .sinner-id {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-right: 10px;
    }

    .sinner-name {
      font-size: 1.4rem;
      font-weight: bold;
    }

    .section-title {
      font-size: 1rem;
      color: #aaa;
      margin-top: 15px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    select {
      width: 100%;
      padding: 8px 12px;
      background-color: #2a2a2a;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      margin-bottom: 8px;
      box-sizing: border-box;
    }

    .ego-group {
      display: grid;
      grid-template-columns: 80px 1fr;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .ego-rank {
      font-weight: bold;
      font-size: 0.85rem;
      padding: 4px 6px;
      border-radius: 3px;
      text-align: center;
    }

    .rank-ZAYIN { background-color: #2e7d32; }
    .rank-TETH  { background-color: #1565c0; }
    .rank-HE    { background-color: #f57f17; color: #000; }
    .rank-WAW   { background-color: #6a1b9a; }
    .rank-ALEPH { background-color: #c62828; }
  </style>
</head>

          { ja: "炎拳事務所生存者", ko: "염권 사무소 생존자" },
          { ja: "黒獣-巳", ko: "흑수-사" },
          { ja: "夜の錐カピターノ", ko: "밤의 송곳 카피타노" },
          { ja: "ロボトミーE.G.O::ランプ", ko: "로보토미 E.G.O::등불" },
          { ja: "LCE E.G.O::AEDD", ko: "LCE E.G.O::AEDD" },
          { ja: "夜明事務所代表", ko: "새벽 사무소 대표" }
        ],
        "egos": {
          "ZAYIN": [{"name": { ja: "ある日突然", ko: "어느 날 갑자기" }, "val": 1}, {"name": { ja: "まやかし", ko: "눈속임" }, "val": 2}],
          "TETH": [{"name": { ja: "なし", ko: "없음" }, "val": 0}, {"name": { ja: "提灯", ko: "초롱" }, "val": 3}, {"name": { ja: "過ぎし日", ko: "지난날" }, "val": 6}, {"name": { ja: "転入届", ko: "전입신고" }, "val": 10}],
          "HE": [{"name": { ja: "なし", ko: "없음" }, "val": 0}, {"name": { ja: "AEDD", ko: "AEDD" }, "val": 4}, {"name": { ja: "厳粛な哀悼", ko: "엄숙한 애도" }, "val": 7}, {"name": { ja: "クリスマスの悪夢", ko: "크리스마스의 악몽" }, "val": 8}],
          "WAW": [{"name": { ja: "なし", ko: "없음" }, "val": 0}, {"name": { ja: "茨の花園", ko: "가시밭길" }, "val": 5}, {"name": { ja: "輝かざる栄光", ko: "빛나지 않는 영광" }, "val": 9}],
          "ALEPH": [{"name": { ja: "なし", ko: "없음" }, "val": 0}]
        }
      }
    ];

    function renderApp() {
      const app = document.getElementById('app');
      app.innerHTML = '';
      const t = translations[currentLang];

      sinnersData.forEach(sinner => {
        const card = document.createElement('div');
        card.className = 'sinner-card';

        let personaOptions = sinner.personas.map((p, index) => `<option value="${index + 1}">${p[currentLang]}</option>`).join('');

        let egoHtml = '';
        for (const [rank, egoList] of Object.entries(sinner.egos)) {
          let options = egoList.map(e => {
            const displayName = (e.val === 0) ? t.none : e.name[currentLang];
            return `<option value="${e.val}">${displayName} ${e.val ? `(ID: ${e.val})` : ''}</option>`;
          }).join('');
          
          egoHtml += `
            <div class="ego-group">
              <span class="ego-rank rank-${rank}">${rank}</span>
              <select id="ego-${sinner.id}-${rank}">
                ${options}
              </select>
            </div>
          `;
        }

        const orderOptions = `<option value="0">${t.unselected}</option>` +
          [...Array(12)].map((_, i) => `<option value="${i + 1}">${i + 1}${t.orderSuffix}</option>`).join('');

        card.innerHTML = `
          <div class="sinner-header">
            <div class="sinner-title">
              <span class="sinner-id">No.${sinner.id}</span>
              <span class="sinner-name">${sinner.name[currentLang]}</span>
            </div>
            <div style="width: 120px;">
              <select id="order-${sinner.id}">
                ${orderOptions}
              </select>
            </div>
          </div>
          
          <div class="section-title">${t.personaTitle}</div>
          <select id="persona-${sinner.id}">
            ${personaOptions}
          </select>

          <div class="section-title">${t.egoTitle}</div>
          ${egoHtml}
        `;

        app.appendChild(card);
      });
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${lang}`).classList.add('active');

      const t = translations[lang];
      document.getElementById('i18n-code-title').innerText = t.codeTitle;
      document.getElementById('teamCodeInput').placeholder = t.placeholder;
      document.getElementById('i18n-btn-generate').innerText = t.btnGenerate;
      document.getElementById('i18n-btn-apply').innerText = t.btnApply;

      // 保存中の選択状態を退避
      const currentSelections = {};
      sinnersData.forEach(s => {
        const pEl = document.getElementById(`persona-${s.id}`);
        const oEl = document.getElementById(`order-${s.id}`);
        if (pEl) currentSelections[`persona-${s.id}`] = pEl.value;
        if (oEl) currentSelections[`order-${s.id}`] = oEl.value;
        ["ZAYIN", "TETH", "HE", "WAW", "ALEPH"].forEach(rank => {
          const eEl = document.getElementById(`ego-${s.id}-${rank}`);
          if (eEl) currentSelections[`ego-${s.id}-${rank}`] = eEl.value;
        });
      });

      renderApp();

      // 選択状態の復元
      for (const [id, val] of Object.entries(currentSelections)) {
        const el = document.getElementById(id);
        if (el) el.value = val;
      }
    }

    // 数値を指定されたビット長に変換
    function toBits(val, bitLength) {
      return (parseInt(val) || 0).toString(2).padStart(bitLength, '0');
    }

    function bitStringToBytes(bitStr) {
      const byteLen = Math.ceil(bitStr.length / 8);
      const bytes = new Uint8Array(byteLen);
      for (let i = 0; i < byteLen; i++) {
        const slice = bitStr.slice(i * 8, (i + 1) * 8).padEnd(8, '0');
        bytes[i] = parseInt(slice, 2);
      }
      return bytes;
    }

    function bytesToBitString(bytes) {
      return Array.from(bytes).map(b => b.toString(2).padStart(8, '0')).join('');
    }

    function bytesToBase64(bytes) {
      let binStr = '';
      bytes.forEach(b => binStr += String.fromCharCode(b));
      return btoa(binStr);
    }

    function base64ToBytes(base64Str) {
      const binStr = atob(base64Str);
      const bytes = new Uint8Array(binStr.length);
      for (let i = 0; i < binStr.length; i++) {
        bytes[i] = binStr.charCodeAt(i);
      }
      return bytes;
    }

    async function gzipCompress(bytes) {
      const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
      const response = new Response(stream);
      return new Uint8Array(await response.arrayBuffer());
    }

    async function gzipDecompress(bytes) {
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const response = new Response(stream);
      return new Uint8Array(await response.arrayBuffer());
    }

    // 編成コードの生成関数 (564bit 規格)
    async function generateCode() {
      const ranks = ["ZAYIN", "TETH", "HE", "WAW", "ALEPH"];
      let bitStr = '0';

      sinnersData.forEach(sinner => {
        const pVal = document.getElementById(`persona-${sinner.id}`).value;
        const orderVal = document.getElementById(`order-${sinner.id}`).value;

        bitStr += toBits(pVal, 7);
        bitStr += toBits(orderVal, 4);

        ranks.forEach(rank => {
          const egoVal = document.getElementById(`ego-${sinner.id}-${rank}`).value;
          bitStr += toBits(egoVal, 7);
        });
      });

      bitStr += '0'.repeat(11);

      const innerBytes = bitStringToBytes(bitStr);
      const innerBase64 = bytesToBase64(innerBytes);

      const textEncoder = new TextEncoder();
      const rawAsciiBytes = textEncoder.encode(innerBase64);
      const compressedBytes = await gzipCompress(rawAsciiBytes);

      const finalCode = bytesToBase64(compressedBytes);
      document.getElementById('teamCodeInput').value = finalCode;
    }

    // 編成コードからの読み込み関数
    async function applyCode() {
      const code = document.getElementById('teamCodeInput').value.trim();
      if (!code) return;

      try {
        const compressedBytes = base64ToBytes(code);

        const rawAsciiBytes = await gzipDecompress(compressedBytes);
        const textDecoder = new TextDecoder();
        const innerBase64 = textDecoder.decode(rawAsciiBytes);

        const innerBytes = base64ToBytes(innerBase64);
        const bitStr = bytesToBitString(innerBytes);

        const dataBits = bitStr.slice(1, 553);
        const ranks = ["ZAYIN", "TETH", "HE", "WAW", "ALEPH"];

        sinnersData.forEach((sinner, i) => {
          const chunk = dataBits.slice(i * 46, (i + 1) * 46);
          if (chunk.length < 46) return;

          const pVal = parseInt(chunk.slice(0, 7), 2);
          const orderVal = parseInt(chunk.slice(7, 11), 2);

          document.getElementById(`persona-${sinner.id}`).value = pVal;
          document.getElementById(`order-${sinner.id}`).value = orderVal;

          ranks.forEach((rank, rIdx) => {
            const egoVal = parseInt(chunk.slice(11 + rIdx * 7, 18 + rIdx * 7), 2);
            const selectEl = document.getElementById(`ego-${sinner.id}-${rank}`);
            if (selectEl) {
              selectEl.value = egoVal;
            }
          });
        });
      } catch (e) {
        alert(translations[currentLang].invalidCode);
        console.error(e);
      }
    }

    // 初期化
    renderApp();
  </script>
